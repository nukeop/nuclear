name: Release Snap

on:
  workflow_run:
    workflows: ["Release Player"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.23.2)"
        required: true

permissions:
  contents: read

jobs:
  snap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            VERSION="${TAG#player@}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download snap from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "player@${{ steps.version.outputs.version }}"
          --repo "${{ github.repository }}"
          --pattern "nuclear_${{ steps.version.outputs.version }}_amd64.snap"

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: nuclear_${{ steps.version.outputs.version }}_amd64.snap
          release: stable
