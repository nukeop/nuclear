name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup JS
        uses: $/.github/actions/setup-js

      - name: Lint
        run: pnpm lint

  actions-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify actions lockfile
        run: gh actions-lock --verify

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup JS
        uses: $/.github/actions/setup-js

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/*/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/*/test-results/junit.xml
          report_type: test_results
          name: codecov-test-results
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: packages/player/src-tauri -> target

      - name: Update apt package lists
        run: sudo apt-get update

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
          version: 2.0

      - name: Setup JS
        uses: $/.github/actions/setup-js

      - name: Build packages
        run: pnpm turbo build --filter='!@nuclearplayer/player'

      - name: Build player
        run: pnpm --filter @nuclearplayer/player tauri build --debug --no-bundle
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
