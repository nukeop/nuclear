name: Release Player

on:
  push:
    tags:
      - "player@*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DO_NOT_TRACK: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            artifact: "macos-aarch64"
            bundle-dir: "packages/player/src-tauri/target/aarch64-apple-darwin/release/bundle"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            artifact: "macos-x64"
            bundle-dir: "packages/player/src-tauri/target/x86_64-apple-darwin/release/bundle"
          - platform: "ubuntu-22.04"
            args: ""
            artifact: "linux-x64"
            bundle-dir: "packages/player/src-tauri/target/release/bundle"
          - platform: "windows-latest"
            args: ""
            artifact: "windows-x64"
            bundle-dir: "packages/player/src-tauri/target/release/bundle"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#player@}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: false
        with:
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle-dir }}/dmg/Nuclear_${{ env.VERSION }}_*.dmg
            ${{ matrix.bundle-dir }}/macos/Nuclear.app.tar.gz*
            ${{ matrix.bundle-dir }}/appimage/Nuclear_${{ env.VERSION }}_*.AppImage*
            ${{ matrix.bundle-dir }}/deb/Nuclear_${{ env.VERSION }}_*.deb*
            ${{ matrix.bundle-dir }}/rpm/Nuclear-${{ env.VERSION }}-*.rpm*
            ${{ matrix.bundle-dir }}/msi/Nuclear_${{ env.VERSION }}_*.msi*
            ${{ matrix.bundle-dir }}/nsis/Nuclear_${{ env.VERSION }}_*-setup.exe*

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#player@}" >> "$GITHUB_ENV"

      - name: Install flatpak-node-generator
        run: pip install --force-reinstall --no-cache-dir git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node

      - name: Download cargo generator
        run: |
          pip install tomlkit
          curl -fsSL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py \
            -o /tmp/flatpak-cargo-generator.py

      - name: Generate pnpm-sources.json
        run: flatpak-node-generator pnpm --pnpm-store-version v11 -o flatpak/pnpm-sources.json pnpm-lock.yaml

      - name: Generate cargo-sources.json
        run: python3 /tmp/flatpak-cargo-generator.py packages/player/src-tauri/Cargo.lock -o flatpak/cargo-sources.json

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Nuclear_${{ env.VERSION }}_x86_64.flatpak
          manifest-path: flatpak/com.nuclearplayer.Nuclear.yml
          cache-key: flatpak-builder-${{ github.sha }}

  snap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate snapcraft.yaml from template
        run: |
          SNAP_VERSION="${GITHUB_REF_NAME#player@}" envsubst '$SNAP_VERSION' < snap/snapcraft.yaml > snap/snapcraft.resolved.yaml
          mv snap/snapcraft.resolved.yaml snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload snap
        uses: actions/upload-artifact@v7
        with:
          name: snap
          if-no-files-found: error
          path: ${{ steps.snapcraft.outputs.snap }}

  publish:
    needs: [build, flatpak, snap]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#player@}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release notes
        run: node packages/tools/src/generate-release-notes.mjs "$VERSION" > release-notes.md

      - name: Collect release assets
        run: >-
          node packages/tools/src/collect-release-assets.mjs
          --version "$VERSION"
          --notes release-notes.md
          --artifacts artifacts
          --out release-assets
          --repository "$GITHUB_REPOSITORY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --title "Nuclear Player v$VERSION"
          --notes-file release-notes.md
          --verify-tag

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/player@}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS disk images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "player@${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "Nuclear_*_aarch64.dmg" \
            --pattern "Nuclear_*_x64.dmg"

      - name: Compute checksums
        id: checksums
        run: |
          echo "arm=$(sha256sum Nuclear_*_aarch64.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "intel=$(sha256sum Nuclear_*_x64.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: NuclearPlayer/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        working-directory: homebrew-tap
        run: |
          sed -i \
            -e 's/^  version ".*"$/  version "${{ steps.version.outputs.version }}"/' \
            -e 's/^  sha256 arm:   ".*",$/  sha256 arm:   "${{ steps.checksums.outputs.arm }}",/' \
            -e 's/^         intel: ".*"$/         intel: "${{ steps.checksums.outputs.intel }}"/' \
            Casks/nuclear.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nuclear.rb
          git commit -m "nuclear ${{ steps.version.outputs.version }}"
          git push
